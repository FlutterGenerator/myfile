<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Online C# Type Converter to System.* with Copy</title>
<style>
  /* Reset some styles and base settings */
  * {
    box-sizing: border-box;
  }

  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    margin: 2rem auto;
    max-width: 720px;
    background: #f7f9fc;
    color: #333;
    padding: 1rem;
  }

  h1 {
    text-align: center;
    color: #007acc;
    margin-bottom: 1.5rem;
  }

  textarea {
    width: 100%;
    height: 200px;
    font-family: 'Source Code Pro', monospace, monospace;
    font-size: 16px;
    padding: 1rem;
    border: 2px solid #d0d7de;
    border-radius: 8px;
    resize: vertical;
    transition: border-color 0.3s ease;
  }

  textarea:focus {
    border-color: #007acc;
    outline: none;
    background: #fff;
    box-shadow: 0 0 8px rgba(0, 122, 204, 0.3);
  }

  button {
    display: inline-block;
    margin-top: 1rem;
    padding: 12px 24px;
    font-size: 16px;
    color: white;
    background: #007acc;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background-color 0.3s ease;
    user-select: none;
  }

  button:disabled {
    background: #a0aec0;
    cursor: not-allowed;
  }

  button:hover:not(:disabled) {
    background: #005f99;
  }

  h2 {
    margin-top: 2rem;
    border-bottom: 2px solid #007acc;
    padding-bottom: 0.3rem;
    color: #005f99;
  }

  pre {
    background: #1e1e1e;
    color: #d4d4d4;
    padding: 1rem;
    border-radius: 8px;
    overflow-x: auto;
    font-family: 'Source Code Pro', monospace, monospace;
    font-size: 15px;
    line-height: 1.5;
    margin-top: 1rem;
    min-height: 100px;
    white-space: pre-wrap;
  }

  #copyBtn {
    margin-top: 1rem;
    background: #28a745;
  }

  #copyBtn:hover {
    background: #218838;
  }

</style>
</head>
<body>

<h1>Online C# Type Converter to System.*</h1>

<textarea id="input" placeholder="Paste your C# code here...">public static void SetResolution(int width, int height, bool fullscreen);</textarea>
<br />
<button id="convertBtn" onclick="convert()">Convert</button>

<h2>Result:</h2>
<pre id="output" aria-live="polite"></pre>
<button id="copyBtn" onclick="copyResult()" style="display:none;">Copy Result</button>

<script>
function convert() {
  let code = document.getElementById('input').value.trim();

  if (!code) {
    alert('Please enter code to convert.');
    return;
  }

  const replacements = {
    '\\bvoid\\b': 'System.Void',
    '\\bint\\b': 'System.Int32',
    '\\bbool\\b': 'System.Boolean',
    '\\bfloat\\b': 'System.Single',
    '\\bdouble\\b': 'System.Double',
    '\\bstring\\b': 'System.String',
    '\\bbyte\\b': 'System.Byte',
    '\\bsbyte\\b': 'System.SByte',
    '\\bshort\\b': 'System.Int16',
    '\\bushort\\b': 'System.UInt16',
    '\\buint\\b': 'System.UInt32',
    '\\blong\\b': 'System.Int64',
    '\\bulong\\b': 'System.UInt64',
    '\\bchar\\b': 'System.Char',
    '\\bdecimal\\b': 'System.Decimal',
    '\\bobject\\b': 'System.Object'
  };

  for (const [key, value] of Object.entries(replacements)) {
    const regex = new RegExp(key, 'g');
    code = code.replace(regex, value);
  }

  const output = document.getElementById('output');
  output.textContent = code;

  const copyBtn = document.getElementById('copyBtn');
  copyBtn.style.display = code ? 'inline-block' : 'none';
}

function copyResult() {
  const output = document.getElementById('output').textContent.trim();
  const copyBtn = document.getElementById('copyBtn');

  if (!output) return;

  const tempTextarea = document.createElement('textarea');
  tempTextarea.value = output;
  document.body.appendChild(tempTextarea);
  tempTextarea.select();
  tempTextarea.setSelectionRange(0, 99999);

  try {
    const successful = document.execCommand('copy');
    if (successful) {
      copyBtn.textContent = 'Copied!';
      setTimeout(() => {
        copyBtn.textContent = 'Copy Result';
      }, 2000);
    } else {
      alert('Failed to copy the result. Please try manually.');
    }
  } catch (err) {
    alert('Error copying. Please try manually.');
  }

  document.body.removeChild(tempTextarea);
}
</script>

</body>
</html>
